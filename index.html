<style>
  html, body { margin: 0; background: #f3f2f2; -webkit-text-size-adjust: 100%; }
  a { color: var(--color-accent-700); text-decoration: none; }
  a:hover { color: var(--color-accent); }
  @keyframes rb-draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
  @keyframes rb-cinch { 0% { transform: scale(1,1); } 55% { transform: scale(0.96,0.8); } 100% { transform: scale(1,0.92); } }
  @keyframes rb-knot { 0% { transform: scale(0) rotate(-200deg); } 65% { transform: scale(1.25) rotate(14deg); } 100% { transform: scale(1) rotate(0deg); } }
  @keyframes rb-petal { 0% { transform: scale(0.05); opacity: 0; } 70% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes rb-ring { 0% { transform: scale(0.25); opacity: 0.9; } 100% { transform: scale(2.6); opacity: 0; } }
  @keyframes rb-burst { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-150px) rotate(220deg); opacity: 0; } }
  @keyframes rb-drop { 0% { transform: translateY(-46px) scale(0.4); opacity: 0; } 60% { transform: translateY(6px) scale(1.1); opacity: 1; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
  @keyframes rb-sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes rb-glow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  @keyframes rb-breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
  @keyframes rb-rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  @keyframes rb-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes rb-flag { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; } }
</style>
</helmet>

                <circle cx="238" cy="460" r="8" fill="#f7cf7a" style="transform-origin: 238px 460px; animation: rb-drop 0.5s cubic-bezier(.3,1.5,.5,1) 2.4s both;"></circle>

            <circle cx="210" cy="312" r="40" fill="none" stroke="var(--color-accent)" stroke-width="2" style="transform-origin: 210px 312px; animation: rb-ring 0.95s ease-out 1.78s both;"></circle>

            <g transform="rotate(180 210 312)"><rect x="205" y="258" width="8" height="8" fill="#f7cf7a" style="animation: rb-burst 1.1s cubic-bezier(.2,.7,.3,1) 1.72s both;"></rect></g>
            <g transform="rotate(216 210 312)"><rect x="205" y="258" width="9" height="9" fill="#201e1d" style="animation: rb-burst 0.92s cubic-bezier(.2,.7,.3,1) 1.78s both;"></rect></g>
            <g transform="rotate(252 210 312)"><rect x="205" y="258" width="10" height="10" fill="var(--color-accent)" style="animation: rb-burst 1s cubic-bezier(.2,.7,.3,1) 1.66s both;"></rect></g>
            <g transform="rotate(288 210 312)"><rect x="205" y="258" width="7" height="7" fill="var(--color-accent-700)" style="animation: rb-burst 0.96s cubic-bezier(.2,.7,.3,1) 1.82s both;"></rect></g>
            <g transform="rotate(324 210 312)"><rect x="205" y="258" width="9" height="9" fill="#f7cf7a" style="animation: rb-burst 1.02s cubic-bezier(.2,.7,.3,1) 1.74s both;"></rect></g>

            <g style="transform-origin: 210px 312px; animation: rb-knot 0.6s cubic-bezier(.34,1.6,.64,1) 1.5s both;">
              <g style="transform-origin: 210px 312px; animation: rb-glow 3.4s ease-in-out 2.6s infinite;">
                <g style="transform-origin: 210px 312px; animation: rb-petal 0.4s cubic-bezier(.3,1.5,.5,1) 1.85s both;">
                  <ellipse cx="210" cy="276" rx="11" ry="23" fill="var(--color-accent)"></ellipse>
                  <ellipse cx="210" cy="348" rx="11" ry="23" fill="var(--color-accent)"></ellipse>
                </g>
                <g style="transform-origin: 210px 312px; animation: rb-petal 0.4s cubic-bezier(.3,1.5,.5,1) 1.95s both;">

                </g>

                  <ellipse cx="235" cy="287" rx="10" ry="22" fill="var(--color-accent-700)" transform="rotate(45 235 287)"></ellipse>

                <g style="transform-origin: 210px 312px; animation: rb-petal 0.4s cubic-bezier(.3,1.5,.5,1) 2.15s both;">

                <circle cx="210" cy="312" r="16" fill="#f3f2f2"></circle>
                <circle cx="210" cy="312" r="7.5" fill="var(--color-accent)" style="transform-origin: 210px 312px; animation: rb-petal 0.35s cubic-bezier(.3,1.6,.5,1) 2.25s both;"></circle>
              </g>
            </g>
          </g>
        </svg>

    <div style="container-type: inline-size; padding: clamp(22px, 4vw, 60px); display: flex; flex-direction: column; justify-content: center; gap: 18px;">
      <h1 style="margin: 0; font-size: clamp(2.2rem, 16cqw, 5rem); line-height: 0.92; letter-spacing: -0.035em;">One thread.<br>One promise.</h1>

      <sc-if value="{{ tied }}" hint-placeholder-val="{{ true }}">
        <div style="border-top: 2px solid var(--color-divider); padding-top: 18px;">
          <div style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; animation: rb-rise 0.5s ease-out both;">ROHAN X BLU STDIO wishes you a</div>
          <div style="font-family: var(--font-heading); font-weight: 900; font-size: clamp(1.4rem, 8.6cqw, 3.4rem); line-height: 0.92; letter-spacing: -0.03em; color: var(--color-accent-700); margin-top: 10px; animation: rb-wipe 0.55s cubic-bezier(.7,0,.2,1) 0.2s both;">HAPPY</div>
          <div style="font-family: var(--font-heading); font-weight: 900; font-size: clamp(1.4rem, 8.6cqw, 3.4rem); line-height: 0.92; letter-spacing: -0.03em; color: var(--color-accent-700); white-space: nowrap; animation: rb-wipe 0.7s cubic-bezier(.7,0,.2,1) 0.45s both;">RAKSHA BANDHAN</div>
          <div style="height: 2px; background: var(--color-accent); margin-top: 16px; transform-origin: left; animation: rb-flag 0.6s cubic-bezier(.7,0,.2,1) 0.9s both;"></div>
        </div>

  <section id="promise" style="padding: clamp(22px, 5vw, 52px) clamp(14px, 4vw, 48px); border-bottom: 2px solid var(--color-divider);">

  </section>

  <sc-if value="{{ showBanner }}" hint-placeholder-val="{{ true }}">
    <section style="background: var(--color-accent); color: var(--color-bg); padding: clamp(32px, 8vw, 96px) clamp(14px, 4vw, 48px);">
      <div style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.9;">ROHAN X BLU STDIO</div>
      <div style="font-family: var(--font-heading); font-weight: 900; font-size: clamp(2.2rem, 13vw, 7rem); line-height: 0.9; letter-spacing: -0.035em; margin-top: 14px;">HAPPY RAKSHA BANDHAN</div>
      <div style="height: 2px; background: var(--color-bg); margin: clamp(20px, 5vw, 44px) 0;"></div>
      <div style="font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;">28 August 2026</div>
    </section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showGreetingBanner&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;autoTieDelayMs&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2400,&quot;min&quot;:0,&quot;max&quot;:6000,&quot;step&quot;:200,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { playing: true, tied: false, run: 0 };
  timers = [];

  componentDidMount() { this.schedule(); }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }

  schedule() {
    this.timers.forEach(clearTimeout);
    const delay = this.props.autoTieDelayMs ?? 2400;
    this.timers = [setTimeout(() => this.setState({ tied: true }), delay)];
  }

  renderVals() {
    return {
      playing: this.state.playing,
      tied: this.state.tied,
      showBanner: this.props.showGreetingBanner ?? true,
      replay: () => {
        this.timers.forEach(clearTimeout);
        this.setState({ playing: false, tied: false });
        requestAnimationFrame(() => requestAnimationFrame(() => {
          this.setState({ playing: true, run: this.state.run + 1 }, () => this.schedule());
        }));
      }
    };
  }
}

</script>
</body>
</html>
